# Server Configuration
server.port=${PORT:8080}
server.forward-headers-strategy=native

# Neon DB Serverless PostgreSQL Pooled Connection
spring.datasource.url=${DB_URL:jdbc:postgresql://ep-muddy-sunset-b4d80e2b-pooler.c-6.us-east-2.aws.neon.tech:5432/neondb?sslmode=require}
spring.datasource.username=${DB_USERNAME:neondb_owner}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool Optimized for Neon DB Serverless & Render Cold Starts
spring.datasource.hikari.pool-name=PncNeonPool
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=60000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.keepalive-time=15000
spring.datasource.hikari.validation-timeout=3000

# JPA & Hibernate Settings
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.format_sql=false

# Spring Virtual Threads (Java 25)
spring.threads.virtual.enabled=true

# Static Web Resources
spring.web.resources.static-locations=classpath:/static/
spring.web.resources.cache.period=3600

# Actuator Health Check for Render zero-downtime deploys
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# Cloudflare R2 S3 Object Storage
cloudflare.r2.endpoint=${R2_ENDPOINT:https://b823bc44241592e012a8f6b554d619a8.r2.cloudflarestorage.com}
cloudflare.r2.bucket=${R2_BUCKET:pnc}
cloudflare.r2.access-key=${R2_ACCESS_KEY:}
cloudflare.r2.secret-key=${R2_SECRET_KEY:}
cloudflare.r2.public-url=${R2_PUBLIC_URL:https://cdn.thynkzone.eu.org}

# Brevo Transactional Email REST API Configuration
brevo.api.key=${BREVO_API_KEY:}
brevo.sender.name=${BREVO_SENDER_NAME:People & Culture}
brevo.sender.email=${BREVO_SENDER_EMAIL:team@thynkzone.eu.org}
