<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" href="/icon/favicon.ico" type="image/x-icon">
    <title>Notifications - P&C</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-main: #18181b;
            --bg-card: rgba(36, 37, 46, 0.85);
            --bg-tertiary: #23232a;
            --accent-primary: #1da1f2;
            --text-primary: #fff;
            --text-secondary: #b0b3b8;
            --border-primary: #2c2f36;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            background: var(--bg-main);
            color: var(--text-primary);
            margin: 0;
            min-height: 100vh;
        }
        .topnav {
            background: var(--bg-card);
            border-bottom: 1px solid var(--border-primary);
            padding: 10px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .nav-logo { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--accent-primary); font-weight: 700; }
        .nav-logo img { width: 36px; height: 36px; }
        .container { max-width: 600px; margin: 24px auto; padding: 0 16px; }
        .notif-card {
            background: var(--bg-card);
            border: 1px solid var(--border-primary);
            border-radius: 12px;
            padding: 14px 18px;
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 12px;
        }
        .notif-icon {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
        }
        .icon-like { background: rgba(29, 161, 242, 0.15); color: #1da1f2; }
        .icon-comment { background: rgba(16, 185, 129, 0.15); color: #10b981; }
        .icon-dislike { background: rgba(224, 36, 94, 0.15); color: #e0245e; }
        .notif-body { flex: 1; font-size: 0.95rem; }
        .notif-time { font-size: 0.8rem; color: var(--text-secondary); margin-top: 4px; }
    </style>
</head>
<body>

    <nav class="topnav">
        <a href="/index.html" class="nav-logo">
            <img src="/icon/p&c.png" alt="P&C">
            <span>People &amp; Culture</span>
        </a>
        <a href="/index.html" style="color: var(--text-secondary);"><i class="fa-solid fa-house"></i></a>
    </nav>

    <div class="container">
        <h1 style="font-size: 1.4rem; margin-bottom: 20px;">Notifications</h1>
        <div id="notifsList">
            <p style="text-align: center; color: var(--text-secondary);">Loading notifications...</p>
        </div>
    </div>

    <script src="/js/api.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const list = document.getElementById('notifsList');
            try {
                const res = await API.getNotifications();
                list.innerHTML = '';
                if (!res.data || !res.data.content || res.data.content.length === 0) {
                    list.innerHTML = '<p style="text-align: center; color: var(--text-secondary); padding: 40px;">No notifications yet.</p>';
                    return;
                }

                res.data.content.forEach(n => {
                    const card = document.createElement('div');
                    card.className = 'notif-card';
                    let iconClass = 'icon-like fa-heart';
                    let actionText = 'liked your post.';
                    if (n.type === 2) { iconClass = 'icon-dislike fa-thumbs-down'; actionText = 'reacted to your post.'; }
                    else if (n.type === 3) { iconClass = 'icon-comment fa-comment'; actionText = `commented: "${n.commentText || ''}"`; }

                    card.innerHTML = `
                        <div class="notif-icon ${iconClass}">
                            <i class="fa-solid ${iconClass.split(' ')[1]}"></i>
                        </div>
                        <div class="notif-body">
                            <div><strong>${n.actorFullName || 'Someone'}</strong> ${actionText}</div>
                            <div class="notif-time">${n.createdAt ? new Date(n.createdAt).toLocaleDateString() : 'Recently'}</div>
                        </div>
                    `;
                    list.appendChild(card);
                });
            } catch (err) {
                list.innerHTML = `<p style="color: #e0245e; text-align: center;">${err.message}</p>`;
            }
        });
    </script>
</body>
</html>
