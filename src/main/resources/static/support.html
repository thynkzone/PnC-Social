<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" href="/icon/favicon.ico" type="image/x-icon">
    <title>Support - P&amp;C</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#1d2226">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/modern-ui.css?v=20261012.4">
</head>
<body class="li-auth-page">

    <!-- Top Logo Only for Title / Branding -->
    <div style="margin-bottom: 24px; text-align: center; position: relative; max-width: 460px; width: 100%;">
        <div style="position: absolute; left: 0; top: 8px;">
            <button onclick="if(history.length>1){history.back()}else{window.location.href='/index.html'}" class="li-back-btn">
                <i class="fa-solid fa-arrow-left"></i> Back
            </button>
        </div>
        <a href="/index.html" class="li-logo-link" title="Home">
            <img src="/icon/p&c.png" alt="Logo" style="width: 48px; height: 48px; border-radius: 8px;">
        </a>
    </div>

    <div class="li-auth-card" style="max-width: 460px; text-align: center;">
        <div style="width: 56px; height: 56px; border-radius: 50%; background: var(--li-primary-soft); color: var(--li-primary); display: inline-flex; align-items: center; justify-content: center; font-size: 24px; margin-bottom: 16px;">
            <i class="fa-solid fa-headset"></i>
        </div>

        <h1 class="li-auth-title">P&amp;C Help &amp; Support</h1>
        <p class="li-auth-subtitle">Need assistance with your account, security, or workplace organization?</p>

        <div style="background: var(--li-bg-elevated); border: 1px solid var(--li-border-light); border-radius: var(--li-radius-md); padding: 18px; margin-bottom: 24px; text-align: left;">
            <div style="font-size: 12px; color: var(--li-text-secondary); margin-bottom: 4px;">Direct Support Email:</div>
            <a href="mailto:thynkzone.help@gmail.com" style="font-size: 15px; font-weight: 700; color: var(--li-primary); text-decoration: none;">
                thynkzone.help@gmail.com
            </a>
            <div style="font-size: 12px; color: var(--li-text-muted); margin-top: 8px;">
                Average response time: Within 24 business hours.
            </div>
        </div>

        <a href="/index.html" class="li-btn-primary" style="width: 100%; padding: 12px; font-size: 14px;">
            Back to Home Feed
        </a>
    </div>

</body>
</html>
