<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" href="/icon/favicon.ico" type="image/x-icon">
    <title>Verify Email - P&amp;C</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/modern-ui.css">
</head>
<body class="li-auth-page">

    <!-- Top Logo Only for Title / Branding -->
    <div style="margin-bottom: 24px; text-align: center;">
        <a href="/index.html" class="li-logo-link" title="Home">
            <img src="/icon/p&c.png" alt="Logo" style="width: 48px; height: 48px; border-radius: 8px;">
        </a>
    </div>

    <div class="li-auth-card" style="max-width: 420px;">
        <div style="width: 56px; height: 56px; border-radius: 50%; background: var(--li-primary-soft); color: var(--li-primary); display: inline-flex; align-items: center; justify-content: center; font-size: 24px; margin-bottom: 16px;">
            <i class="fa-solid fa-envelope-circle-check"></i>
        </div>

        <h1 class="li-auth-title">Verify your email</h1>
        <p class="li-auth-subtitle" id="verifySubtitle">Enter the 6-digit confirmation code sent to your inbox.</p>

        <div id="alertBox" style="display: none; padding: 10px 14px; background: rgba(224, 36, 94, 0.18); border: 1px solid var(--li-danger); color: #ff85a1; border-radius: var(--li-radius-sm); font-size: 13px; margin-bottom: 16px; text-align: left;"></div>

        <form id="verifyForm" onsubmit="handleVerify(event)">
            <div class="li-form-group">
                <input type="text" id="verificationCode" class="li-input" maxlength="6" required autocomplete="one-time-code" placeholder="000000" style="text-align: center; font-size: 26px; letter-spacing: 8px; font-weight: 700; padding: 12px 16px;">
            </div>

            <button type="submit" id="submitBtn" class="li-btn-primary" style="width: 100%; padding: 12px; font-size: 15px; margin-top: 8px;">
                Verify &amp; Continue
            </button>
        </form>

        <div class="li-footer" style="margin-top: 24px; padding-top: 16px;">
            Didn't receive the code? <a href="javascript:void(0)" onclick="resendCode()" style="color: var(--li-primary); font-weight: 600; text-decoration: none;">Resend</a>
        </div>
    </div>

    <!-- Mini Footer -->
    <div style="margin-top: 28px; text-align: center; font-size: 11px; color: var(--li-text-muted);">
        <div class="li-footer-links" style="margin-bottom: 6px;">
            <a href="/about-us.html">About</a>
            <a href="/support.html">Help Center</a>
            <a href="/terms-and-conditions.html">Privacy &amp; Terms</a>
        </div>
        <span>People &amp; Culture &copy; 2026</span>
    </div>

    <script src="/js/api.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const email = urlParams.get('email') || '';

        if (email) {
            document.getElementById('verifySubtitle').innerText = `Enter the 6-digit confirmation code sent to ${email}`;
        }

        async function handleVerify(e) {
            e.preventDefault();
            const code = document.getElementById('verificationCode').value.trim();
            const submitBtn = document.getElementById('submitBtn');
            const alertBox = document.getElementById('alertBox');

            alertBox.style.display = 'none';
            submitBtn.disabled = true;
            submitBtn.innerText = 'Verifying...';

            try {
                const res = await API.verify(email, code);
                if (res.success) {
                    showToast('Email verified successfully!');
                    window.location.href = '/add-information.html';
                }
            } catch (err) {
                alertBox.innerText = err.message || 'Invalid or expired verification code.';
                alertBox.style.display = 'block';
                submitBtn.disabled = false;
                submitBtn.innerText = 'Verify & Continue';
            }
        }

        async function resendCode() {
            if (!email) {
                alert('No email found in session.');
                return;
            }
            try {
                showToast('A new code has been sent.');
            } catch (e) {
                showToast('Unable to resend code right now.', true);
            }
        }
    </script>
</body>
</html>
