<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" href="/icon/favicon.ico" type="image/x-icon">
    <title>Verify Email - P&C</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-main: #18181b;
            --bg-card: rgba(36, 37, 46, 0.9);
            --accent-primary: #1da1f2;
            --accent-secondary: #0a8cd8;
            --accent-danger: #e0245e;
            --text-primary: #fff;
            --text-secondary: #b0b3b8;
            --border-primary: #2c2f36;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
        }
        body {
            background: var(--bg-main);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .card {
            background: var(--bg-card);
            border: 1px solid var(--border-primary);
            border-radius: 16px;
            padding: 40px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            text-align: center;
        }
        h1 {
            font-size: 1.5rem;
            margin-bottom: 8px;
            color: var(--accent-primary);
        }
        p.subtitle {
            color: var(--text-secondary);
            font-size: 0.95rem;
            margin-bottom: 24px;
        }
        input {
            width: 100%;
            background: #23232a;
            border: 1.5px solid var(--border-primary);
            border-radius: 8px;
            padding: 14px;
            color: var(--text-primary);
            font-size: 1.3rem;
            text-align: center;
            letter-spacing: 6px;
            outline: none;
            margin-bottom: 20px;
        }
        input:focus {
            border-color: var(--accent-primary);
        }
        .btn-submit {
            width: 100%;
            background: var(--accent-primary);
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 14px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
        }
        .alert-box {
            display: none;
            padding: 10px 14px;
            background: rgba(224, 36, 94, 0.2);
            border: 1px solid var(--accent-danger);
            color: #fff;
            border-radius: 8px;
            font-size: 0.9rem;
            margin-bottom: 18px;
        }
    </style>
</head>
<body>

    <div class="card">
        <div style="font-size: 3rem; color: var(--accent-primary); margin-bottom: 16px;">
            <i class="fa-solid fa-envelope-circle-check"></i>
        </div>
        <h1>Verify Email Address</h1>
        <p class="subtitle" id="subtext">Enter the 6-digit code sent to your email.</p>

        <div id="alertBox" class="alert-box"></div>

        <form onsubmit="handleVerify(event)">
            <input type="text" id="code" maxlength="6" pattern="[0-9]{6}" required placeholder="######" autofocus>
            <button type="submit" id="submitBtn" class="btn-submit">Verify &amp; Continue</button>
        </form>

        <p style="margin-top: 20px; font-size: 0.85rem; color: var(--text-secondary);">
            Didn't get the code? Check your spam folder or <a href="/signup.html" style="color: var(--accent-primary);">register again</a>.
        </p>
    </div>

    <script src="/js/api.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const email = urlParams.get('email');

        if (email) {
            document.getElementById('subtext').innerText = `Enter the 6-digit code sent to ${email}`;
        }

        async function handleVerify(e) {
            e.preventDefault();
            const code = document.getElementById('code').value.trim();
            const submitBtn = document.getElementById('submitBtn');
            const alertBox = document.getElementById('alertBox');

            if (!email) {
                alertBox.innerText = 'Email parameter missing. Please sign up again.';
                alertBox.style.display = 'block';
                return;
            }

            alertBox.style.display = 'none';
            submitBtn.disabled = true;
            submitBtn.innerText = 'Verifying...';

            try {
                const res = await API.verifyCode(email, code);
                if (res.success) {
                    showToast('Email verified successfully!');
                    window.location.href = '/add-information.html';
                }
            } catch (err) {
                alertBox.innerText = err.message || 'Verification failed.';
                alertBox.style.display = 'block';
                submitBtn.disabled = false;
                submitBtn.innerText = 'Verify & Continue';
            }
        }
    </script>
</body>
</html>
