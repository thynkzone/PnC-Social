<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" href="/icon/favicon.ico" type="image/x-icon">
    <title>Network - P&C</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-main: #18181b;
            --bg-card: rgba(36, 37, 46, 0.85);
            --bg-tertiary: #23232a;
            --accent-primary: #1da1f2;
            --text-primary: #fff;
            --text-secondary: #b0b3b8;
            --border-primary: #2c2f36;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            background: var(--bg-main);
            color: var(--text-primary);
            margin: 0;
            min-height: 100vh;
        }
        .topnav {
            background: var(--bg-card);
            border-bottom: 1px solid var(--border-primary);
            padding: 10px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .nav-logo { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--accent-primary); font-weight: 700; }
        .nav-logo img { width: 36px; height: 36px; }
        .container { max-width: 640px; margin: 24px auto; padding: 0 16px; }
        .tabs { display: flex; gap: 12px; margin-bottom: 20px; border-bottom: 1px solid var(--border-primary); padding-bottom: 10px; }
        .tab-btn {
            background: none; border: none; color: var(--text-secondary);
            font-size: 1rem; font-weight: 600; cursor: pointer; padding: 6px 12px;
            border-radius: 8px;
        }
        .tab-btn.active { color: #fff; background: var(--accent-primary); }
        .user-item {
            background: var(--bg-card);
            border: 1px solid var(--border-primary);
            border-radius: 12px;
            padding: 14px 18px;
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 12px;
        }
        .user-avatar { width: 44px; height: 44px; border-radius: 50%; object-fit: cover; }
        .user-info { flex: 1; }
        .user-name { font-weight: 600; text-decoration: none; color: var(--text-primary); }
        .user-role { font-size: 0.8rem; color: var(--text-secondary); margin-top: 2px; }
    </style>
</head>
<body>

    <nav class="topnav">
        <a href="/index.html" class="nav-logo">
            <img src="/icon/p&c.png" alt="P&C">
            <span>People &amp; Culture</span>
        </a>
        <div style="display: flex; gap: 20px;">
            <a href="/index.html" style="color: var(--text-secondary);"><i class="fa-solid fa-house"></i></a>
            <a href="/post-updates.html" style="color: var(--text-secondary);"><i class="fa-solid fa-bell"></i></a>
        </div>
    </nav>

    <div class="container">
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('coworkers')">Co-workers</button>
            <button class="tab-btn" onclick="switchTab('following')">Following</button>
            <button class="tab-btn" onclick="switchTab('followers')">Followers</button>
        </div>

        <div id="usersList">
            <p style="text-align: center; color: var(--text-secondary);">Loading...</p>
        </div>
    </div>

    <script src="/js/api.js"></script>
    <script>
        let currentTab = 'coworkers';

        document.addEventListener('DOMContentLoaded', () => {
            loadTab(currentTab);
        });

        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
            loadTab(tab);
        }

        async function loadTab(tab) {
            const list = document.getElementById('usersList');
            list.innerHTML = '<p style="text-align: center; color: var(--text-secondary);">Loading...</p>';

            try {
                let res;
                if (tab === 'coworkers') res = await API.getCoworkers();
                else if (tab === 'following') res = await API.getFollowing();
                else res = await API.getFollowers();

                list.innerHTML = '';
                if (!res.data || res.data.length === 0) {
                    list.innerHTML = `<p style="text-align: center; color: var(--text-secondary); padding: 30px;">No ${tab} found.</p>`;
                    return;
                }

                res.data.forEach(u => {
                    const avatar = u.profilePic && u.profilePic.startsWith('http') ? u.profilePic : `/images/${u.profilePic || 'prof.png'}`;
                    const item = document.createElement('div');
                    item.className = 'user-item';
                    item.innerHTML = `
                        <img class="user-avatar" src="${avatar}" alt="">
                        <div class="user-info">
                            <a href="/profile.html?userId=${u.id}" class="user-name">${u.fullName}</a>
                            <div class="user-role">${u.rank || 'Member'} • ${u.place || 'Remote'}</div>
                        </div>
                        <a href="/profile.html?userId=${u.id}" style="color: var(--accent-primary); font-size: 0.9rem; text-decoration: none; font-weight: 500;">View</a>
                    `;
                    list.appendChild(item);
                });
            } catch (err) {
                list.innerHTML = `<p style="color: #e0245e; text-align: center;">${err.message}</p>`;
            }
        }
    </script>
</body>
</html>
