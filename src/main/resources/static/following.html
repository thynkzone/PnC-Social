<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" href="/icon/favicon.ico" type="image/x-icon">
    <title>My Network - P&amp;C</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#1d2226">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/modern-ui.css">
    <style>
        .network-container {
            max-width: 840px;
            margin: 20px auto 40px;
            padding: 0 16px;
        }

        .network-tabs {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 12px 16px;
            border-bottom: 1px solid var(--li-border-light);
            overflow-x: auto;
        }
        .network-tab-btn {
            background: transparent;
            border: 1px solid transparent;
            color: var(--li-text-secondary);
            font-size: 13px;
            font-weight: 600;
            padding: 8px 16px;
            border-radius: var(--li-radius-pill);
            cursor: pointer;
            transition: all 0.15s ease;
            white-space: nowrap;
        }
        .network-tab-btn:hover {
            background: var(--li-bg-hover);
            color: #fff;
        }
        .network-tab-btn.active {
            background: var(--li-primary);
            color: #fff;
        }

        .network-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 16px;
            padding: 16px;
        }
        .network-user-card {
            background: var(--li-bg-surface);
            border: 1px solid var(--li-border);
            border-radius: var(--li-radius-md);
            text-align: center;
            padding: 20px 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: transform 0.15s, border-color 0.15s;
        }
        .network-user-card:hover {
            border-color: var(--li-primary);
            transform: translateY(-2px);
        }
        .network-avatar {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--li-border);
            margin-bottom: 12px;
        }
        .network-user-name {
            font-size: 15px;
            font-weight: 700;
            color: #fff;
            text-decoration: none;
            margin-bottom: 2px;
            max-width: 100%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .network-user-name:hover {
            color: var(--li-primary);
            text-decoration: underline;
        }
        .network-user-headline {
            font-size: 12px;
            color: var(--li-text-secondary);
            margin-bottom: 14px;
            line-height: 1.35;
            min-height: 32px;
        }
    </style>
</head>
<body>

    <!-- LinkedIn Top Navbar (Logo Only for branding) -->
    <header class="li-navbar">
        <div class="li-nav-inner">
            <div class="li-nav-left">
                <!-- Only logo for title/brand, no text -->
                <a href="/index.html" class="li-logo-link" title="P&amp;C Home">
                    <img src="/icon/p&c.png" alt="P&amp;C" class="li-logo-img">
                </a>
                
                <div class="li-search-box">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" id="globalNavSearch" class="li-search-input" placeholder="Search people, topics..." onkeydown="if(event.key==='Enter') window.location.href='/search-user.html?q='+encodeURIComponent(this.value)">
                </div>
            </div>

            <nav class="li-nav-menu">
                <a href="/index.html" class="li-nav-item" title="Home Feed">
                    <i class="fa-solid fa-house"></i>
                    <span>Home</span>
                </a>
                <a href="/following.html" class="li-nav-item active" title="My Network">
                    <i class="fa-solid fa-user-group"></i>
                    <span>My Network</span>
                </a>
                <a href="/advertisements.html" class="li-nav-item" title="Ads &amp; Campaigns">
                    <i class="fa-solid fa-bullhorn"></i>
                    <span>Ads</span>
                </a>
                <a href="/post-updates.html" class="li-nav-item" title="Notifications">
                    <i class="fa-solid fa-bell"></i>
                    <span>Notifications</span>
                </a>
                
                <!-- Authenticated User Dropdown -->
                <div class="li-nav-item" id="navMeItem" style="display: none;" onclick="toggleMeDropdown(event)">
                    <img id="navAvatar" class="li-nav-avatar" src="/images/prof.png" alt="Profile">
                    <span style="display: flex; align-items: center; gap: 2px;">Me <i class="fa-solid fa-caret-down" style="font-size: 9px;"></i></span>

                    <div class="li-dropdown-menu" id="meDropdownMenu">
                        <div style="padding: 10px 16px; display: flex; gap: 10px; align-items: center;">
                            <img id="menuAvatar" style="width: 40px; height: 40px; border-radius: 50%; object-fit: cover;" src="/images/prof.png" alt="User">
                            <div style="min-width: 0;">
                                <div id="menuName" style="font-weight: 700; font-size: 13px; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">User</div>
                                <div id="menuHeadline" style="font-size: 11px; color: var(--li-text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">Professional</div>
                            </div>
                        </div>
                        <div class="li-dropdown-divider"></div>
                        <a href="/profile.html" id="menuProfileLink" class="li-dropdown-item"><i class="fa-solid fa-user"></i> View Profile</a>
                        <a href="/view-all-requests.html" class="li-dropdown-item"><i class="fa-solid fa-user-clock"></i> Pending Requests</a>
                        <a href="/settings.html" class="li-dropdown-item"><i class="fa-solid fa-gear"></i> Settings &amp; Privacy</a>
                        <div class="li-dropdown-divider"></div>
                        <a href="javascript:void(0)" onclick="handleLogout()" class="li-dropdown-item" style="color: var(--li-danger);"><i class="fa-solid fa-right-from-bracket"></i> Sign Out</a>
                    </div>
                </div>

                <a href="/login.html" id="navLoginBtn" class="li-btn-primary" style="margin-left: 8px; font-size: 13px; padding: 6px 16px;">
                    Sign In
                </a>
            </nav>
        </div>
    </header>

    <div class="network-container">
        <div style="margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between;">
            <button onclick="if(history.length>1){history.back()}else{window.location.href='/index.html'}" class="li-back-btn">
                <i class="fa-solid fa-arrow-left"></i> Back to Feed
            </button>
            <a href="/people-you-may-know.html" class="li-btn-primary" style="font-size: 13px; padding: 6px 14px;">
                <i class="fa-solid fa-user-plus"></i> Find People You May Know
            </a>
        </div>

        <div class="li-card">
            <div class="network-tabs">
                <button class="network-tab-btn active" onclick="switchTab('coworkers', this)">Co-workers</button>
                <button class="network-tab-btn" onclick="switchTab('following', this)">Following</button>
                <button class="network-tab-btn" onclick="switchTab('followers', this)">Followers</button>
                <a href="/people-you-may-know.html" class="network-tab-btn" style="text-decoration: none; color: var(--li-text-secondary);">
                    <i class="fa-solid fa-lightbulb"></i> Suggestions
                </a>
                <a href="/view-all-requests.html" class="network-tab-btn" style="text-decoration: none; margin-left: auto; border: 1px solid var(--li-primary); color: var(--li-primary);">
                    <i class="fa-solid fa-user-clock"></i> Pending Requests
                </a>
            </div>

            <div id="usersList" class="network-grid">
                <p style="text-align: center; color: var(--li-text-muted); grid-column: 1 / -1; padding: 40px;">Loading your network...</p>
            </div>
        </div>
    </div>

    <script src="/js/api.js?v=2.2"></script>
    <script>
        let currentTab = 'coworkers';

        document.addEventListener('DOMContentLoaded', async () => {
            try {
                const meRes = await API.getCurrentUser();
                if (meRes && meRes.success) {
                    setupNavbarMe(meRes.data);
                }
            } catch (err) {}

            loadTab(currentTab);
        });

        function setupNavbarMe(user) {
            document.getElementById('navLoginBtn').style.display = 'none';
            const navMe = document.getElementById('navMeItem');
            navMe.style.display = 'flex';
            if (user.profilePic) {
                const pic = user.profilePic.startsWith('http') ? user.profilePic : `/images/${user.profilePic}`;
                document.getElementById('navAvatar').src = pic;
                document.getElementById('menuAvatar').src = pic;
            }
            document.getElementById('menuName').innerText = user.fullName || 'User';
            document.getElementById('menuHeadline').innerText = `${user.rank || 'Member'} • ${user.rating || 0} pts`;
            document.getElementById('menuProfileLink').href = `/profile.html?userId=${user.id}`;
        }

        function toggleMeDropdown(e) {
            e.stopPropagation();
            const menu = document.getElementById('meDropdownMenu');
            menu.classList.toggle('show');
        }

        document.addEventListener('click', () => {
            const menu = document.getElementById('meDropdownMenu');
            if (menu) menu.classList.remove('show');
        });

        async function handleLogout() {
            try {
                await API.logout();
            } finally {
                window.location.href = '/login.html';
            }
        }

        function switchTab(tab, btn) {
            currentTab = tab;
            document.querySelectorAll('.network-tab-btn').forEach(b => {
                if (b.tagName === 'BUTTON') b.classList.remove('active');
            });
            btn.classList.add('active');
            loadTab(tab);
        }

        async function loadTab(tab) {
            const list = document.getElementById('usersList');
            list.innerHTML = '<p style="text-align: center; color: var(--li-text-muted); grid-column: 1 / -1; padding: 40px;">Loading...</p>';

            try {
                let res;
                if (tab === 'coworkers') res = await API.getCoworkers();
                else if (tab === 'following') res = await API.getFollowing();
                else res = await API.getFollowers();

                list.innerHTML = '';
                if (!res.data || res.data.length === 0) {
                    list.innerHTML = `<p style="text-align: center; color: var(--li-text-muted); grid-column: 1 / -1; padding: 40px;">No ${tab} found in your network.</p>`;
                    return;
                }

                res.data.forEach(u => {
                    const avatar = u.profilePic && u.profilePic.startsWith('http') ? u.profilePic : `/images/${u.profilePic || 'prof.png'}`;
                    const card = document.createElement('div');
                    card.className = 'network-user-card';
                    card.innerHTML = `
                        <img class="network-avatar" src="${avatar}" alt="${u.fullName || 'User'}">
                        <a href="/profile.html?userId=${u.id}" class="network-user-name">${u.fullName}</a>
                        <div class="network-user-headline">${u.rank || 'Member'} &bull; ${u.place || 'Remote'}</div>
                        <a href="/profile.html?userId=${u.id}" class="li-btn-secondary" style="width: 100%; font-size: 13px; padding: 6px 12px; margin-top: auto;">
                            View Profile
                        </a>
                    `;
                    list.appendChild(card);
                });
            } catch (err) {
                list.innerHTML = `<p style="color: var(--li-danger); text-align: center; grid-column: 1 / -1; padding: 30px;">${err.message}</p>`;
            }
        }
    </script>
</body>
</html>
