<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" href="/icon/favicon.ico" type="image/x-icon">
    <title>Forgot Password - P&amp;C (People &amp; Culture)</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#1d2226">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/modern-ui.css">
    <style>
        :root {
            --bg-main: #18181b;
            --bg-card: rgba(36, 37, 46, 0.9);
            --bg-tertiary: #23232a;
            --accent-primary: #1da1f2;
            --accent-secondary: #0a8cd8;
            --accent-danger: #e0245e;
            --accent-success: #10b981;
            --text-primary: #fff;
            --text-secondary: #b0b3b8;
            --border-primary: #2c2f36;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
        }
        body {
            background: var(--bg-main);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .card {
            background: var(--bg-card);
            border: 1px solid var(--border-primary);
            border-radius: 16px;
            padding: 40px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            text-align: center;
        }
        .logo-img {
            width: 56px;
            height: 56px;
            margin-bottom: 16px;
        }
        h1 {
            font-size: 1.5rem;
            margin-bottom: 8px;
            color: var(--text-primary);
        }
        p.subtitle {
            color: var(--text-secondary);
            font-size: 0.92rem;
            margin-bottom: 24px;
            line-height: 1.45;
        }
        .tab-bar {
            display: flex;
            background: var(--bg-tertiary);
            border-radius: 8px;
            padding: 4px;
            margin-bottom: 22px;
            border: 1px solid var(--border-primary);
        }
        .tab-btn {
            flex: 1;
            padding: 8px 12px;
            background: transparent;
            color: var(--text-secondary);
            border: none;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .tab-btn.active {
            background: var(--accent-primary);
            color: #fff;
        }
        .form-group {
            margin-bottom: 18px;
            text-align: left;
        }
        label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }
        input {
            width: 100%;
            background: var(--bg-tertiary);
            border: 1.5px solid var(--border-primary);
            border-radius: 8px;
            padding: 12px 14px;
            color: var(--text-primary);
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus {
            border-color: var(--accent-primary);
        }
        .btn-submit {
            width: 100%;
            background: var(--accent-primary);
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 13px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 6px;
            transition: background 0.2s;
        }
        .btn-submit:hover {
            background: var(--accent-secondary);
        }
        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .alert-box {
            display: none;
            padding: 12px 14px;
            border-radius: 8px;
            font-size: 0.9rem;
            margin-bottom: 18px;
            text-align: left;
            line-height: 1.4;
        }
        .alert-error {
            background: rgba(224, 36, 94, 0.18);
            border: 1px solid var(--accent-danger);
            color: #ff85a1;
        }
        .alert-success {
            background: rgba(16, 185, 129, 0.18);
            border: 1px solid var(--accent-success);
            color: #6ee7b7;
        }
        .footer-links {
            margin-top: 24px;
            font-size: 0.9rem;
            color: var(--text-secondary);
        }
        .footer-links a {
            color: var(--accent-primary);
            text-decoration: none;
            font-weight: 500;
        }
        .footer-links a:hover {
            text-decoration: underline;
        }
        .hint-text {
            font-size: 0.78rem;
            color: var(--text-secondary);
            margin-top: 4px;
        }
    </style>
</head>
<body>

    <div class="card">
        <div style="text-align: left; margin-bottom: 12px;">
            <button onclick="if(history.length>1){history.back()}else{window.location.href='/login.html'}" class="li-back-btn">
                <i class="fa-solid fa-arrow-left"></i> Back to Sign In
            </button>
        </div>
        <a href="/index.html">
            <img src="/icon/p&c.png" alt="P&C" class="logo-img">
        </a>
        <h1>Reset Your Password</h1>
        <p class="subtitle" id="pageSubtitle">Enter your work email to receive a recovery code or reset using your signup recovery key.</p>

        <div id="alertBox" class="alert-box"></div>

        <div class="tab-bar">
            <button type="button" class="tab-btn active" id="tabEmail" onclick="switchTab('request')">
                <i class="fa-solid fa-envelope"></i> Request Code
            </button>
            <button type="button" class="tab-btn" id="tabReset" onclick="switchTab('reset')">
                <i class="fa-solid fa-key"></i> Enter Code &amp; Reset
            </button>
        </div>

        <!-- Step 1: Request Code -->
        <form id="requestForm" onsubmit="handleRequestCode(event)">
            <div class="form-group">
                <label for="requestEmail">Work Email Address</label>
                <input type="email" id="requestEmail" required autocomplete="email" placeholder="name@company.com">
                <div class="hint-text">We'll send a 6-digit verification code to this address via Brevo.</div>
            </div>

            <button type="submit" id="requestBtn" class="btn-submit">
                <i class="fa-solid fa-paper-plane"></i> Send Recovery Code
            </button>
        </form>

        <!-- Step 2: Reset with Code or Recovery Key -->
        <form id="resetForm" style="display: none;" onsubmit="handleResetPassword(event)">
            <div class="form-group">
                <label for="resetEmail">Work Email Address</label>
                <input type="email" id="resetEmail" required autocomplete="email" placeholder="name@company.com">
            </div>

            <div class="form-group">
                <label for="resetCode">Reset Code or Recovery Code</label>
                <input type="text" id="resetCode" required placeholder="6-digit email code or recovery code">
                <div class="hint-text">Enter the 6-digit email code OR your permanent signup recovery code.</div>
            </div>

            <div class="form-group">
                <label for="newPassword">New Password</label>
                <input type="password" id="newPassword" required minlength="6" placeholder="At least 6 characters">
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirm New Password</label>
                <input type="password" id="confirmPassword" required minlength="6" placeholder="Re-enter new password">
            </div>

            <button type="submit" id="resetBtn" class="btn-submit">
                <i class="fa-solid fa-lock-open"></i> Update Password
            </button>
        </form>

        <div class="footer-links">
            Remember your credentials? <a href="/login.html">Sign In</a>
        </div>
    </div>

    <script src="/js/api.js?v=2.2"></script>
    <script>
        function showAlert(message, isSuccess = false) {
            const box = document.getElementById('alertBox');
            box.className = `alert-box ${isSuccess ? 'alert-success' : 'alert-error'}`;
            box.innerText = message;
            box.style.display = 'block';
        }

        function clearAlert() {
            const box = document.getElementById('alertBox');
            box.style.display = 'none';
        }

        function switchTab(tab) {
            clearAlert();
            const tabEmail = document.getElementById('tabEmail');
            const tabReset = document.getElementById('tabReset');
            const requestForm = document.getElementById('requestForm');
            const resetForm = document.getElementById('resetForm');
            const subtitle = document.getElementById('pageSubtitle');

            if (tab === 'request') {
                tabEmail.classList.add('active');
                tabReset.classList.remove('active');
                requestForm.style.display = 'block';
                resetForm.style.display = 'none';
                subtitle.innerText = 'Enter your work email to receive a recovery code or reset using your signup recovery key.';
            } else {
                tabReset.classList.add('active');
                tabEmail.classList.remove('active');
                requestForm.style.display = 'none';
                resetForm.style.display = 'block';
                subtitle.innerText = 'Enter your email, verification or recovery code, and your new password.';
                const reqEmailVal = document.getElementById('requestEmail').value.trim();
                if (reqEmailVal && !document.getElementById('resetEmail').value) {
                    document.getElementById('resetEmail').value = reqEmailVal;
                }
            }
        }

        async function handleRequestCode(e) {
            e.preventDefault();
            clearAlert();
            const email = document.getElementById('requestEmail').value.trim();
            const btn = document.getElementById('requestBtn');

            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Sending...';

            try {
                const res = await API.forgotPassword(email);
                showAlert(res.message || 'If an account exists, a reset code was sent. Proceed to enter code below.', true);
                document.getElementById('resetEmail').value = email;
                setTimeout(() => {
                    switchTab('reset');
                }, 1200);
            } catch (err) {
                showAlert(err.message || 'Failed to send reset code. Please try again.');
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> Send Recovery Code';
            }
        }

        async function handleResetPassword(e) {
            e.preventDefault();
            clearAlert();
            const email = document.getElementById('resetEmail').value.trim();
            const code = document.getElementById('resetCode').value.trim();
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const btn = document.getElementById('resetBtn');

            if (newPassword !== confirmPassword) {
                showAlert('New passwords do not match. Please verify and try again.');
                return;
            }

            if (newPassword.length < 6) {
                showAlert('Password must be at least 6 characters.');
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Updating...';

            try {
                const res = await API.resetPassword(email, code, newPassword);
                showAlert(res.message || 'Password successfully updated! Redirecting to sign in...', true);
                setTimeout(() => {
                    window.location.href = '/login.html';
                }, 2000);
            } catch (err) {
                showAlert(err.message || 'Failed to reset password. Please check your code.');
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-lock-open"></i> Update Password';
            }
        }
    </script>
</body>
</html>
