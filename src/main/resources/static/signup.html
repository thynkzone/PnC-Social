<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" href="/icon/favicon.ico" type="image/x-icon">
    <title>Join P&amp;C</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#1d2226">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/modern-ui.css">
</head>
<body class="li-auth-page">

    <!-- Top Logo Only for Title / Branding -->
    <div style="margin-bottom: 24px; text-align: center; position: relative; max-width: 440px; width: 100%;">
        <div style="position: absolute; left: 0; top: 8px;">
            <button onclick="if(history.length>1){history.back()}else{window.location.href='/login.html'}" class="li-back-btn">
                <i class="fa-solid fa-arrow-left"></i> Back
            </button>
        </div>
        <a href="/index.html" class="li-logo-link" title="Home">
            <img src="/icon/p&c.png" alt="Logo" style="width: 48px; height: 48px; border-radius: 8px;">
        </a>
    </div>

    <div class="li-auth-card" style="max-width: 440px;">
        <h1 class="li-auth-title">Make the most of your professional life</h1>
        <p class="li-auth-subtitle">Join coworkers and industry peers on P&amp;C</p>

        <div id="alertBox" style="display: none; padding: 10px 14px; background: rgba(224, 36, 94, 0.18); border: 1px solid var(--li-danger); color: #ff85a1; border-radius: var(--li-radius-sm); font-size: 13px; margin-bottom: 16px; text-align: left;"></div>

        <form id="signupForm" onsubmit="handleSignup(event)">
            <div class="li-form-group">
                <label class="li-label" for="email">Work Email</label>
                <input type="email" id="email" class="li-input" required autocomplete="email" placeholder="name@company.com">
            </div>

            <div class="li-form-group">
                <label class="li-label" for="password">Password (8+ characters)</label>
                <input type="password" id="password" class="li-input" minlength="8" required autocomplete="new-password" placeholder="At least 8 characters">
            </div>

            <div class="li-form-group">
                <label class="li-label" for="recoveryCode">Security Recovery Code (keep safe)</label>
                <input type="text" id="recoveryCode" class="li-input" minlength="3" required placeholder="A phrase or word only you know">
            </div>

            <p style="font-size: 11px; color: var(--li-text-muted); text-align: left; margin: 12px 0 16px; line-height: 1.4;">
                By clicking Agree &amp; Join, you agree to P&amp;C's 
                <a href="/terms-and-conditions.html" style="color: var(--li-primary); text-decoration: none;">User Agreement</a> and 
                <a href="/terms-and-conditions.html" style="color: var(--li-primary); text-decoration: none;">Privacy Policy</a>.
            </p>

            <button type="submit" id="submitBtn" class="li-btn-primary" style="width: 100%; padding: 12px; font-size: 15px;">
                Agree &amp; Join
            </button>
        </form>

        <div class="li-footer" style="margin-top: 24px; padding-top: 16px;">
            Already on P&amp;C? <a href="/login.html" style="color: var(--li-primary); font-weight: 600; text-decoration: none;">Sign in</a>
        </div>
    </div>

    <!-- Mini Footer -->
    <div style="margin-top: 28px; text-align: center; font-size: 11px; color: var(--li-text-muted);">
        <div class="li-footer-links" style="margin-bottom: 6px;">
            <a href="/about-us.html">About</a>
            <a href="/support.html">Help Center</a>
            <a href="/terms-and-conditions.html">Privacy &amp; Terms</a>
        </div>
        <span>People &amp; Culture &copy; 2026</span>
    </div>

    <script src="/js/api.js?v=2.2"></script>
    <script>
        async function handleSignup(e) {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const recoveryCode = document.getElementById('recoveryCode').value.trim();
            const submitBtn = document.getElementById('submitBtn');
            const alertBox = document.getElementById('alertBox');

            alertBox.style.display = 'none';
            submitBtn.disabled = true;
            submitBtn.innerText = 'Creating account...';

            try {
                const res = await API.signup(email, password, recoveryCode);
                if (res.success) {
                    window.location.href = `/verify-code.html?email=${encodeURIComponent(email)}`;
                }
            } catch (err) {
                alertBox.innerText = err.message || 'Signup failed.';
                alertBox.style.display = 'block';
                submitBtn.disabled = false;
                submitBtn.innerText = 'Agree & Join';
            }
        }
    </script>
</body>
</html>
