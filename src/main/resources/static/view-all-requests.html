<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" href="/icon/favicon.ico" type="image/x-icon">
    <title>Co-worker Requests - P&C</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-main: #18181b;
            --bg-card: rgba(36, 37, 46, 0.85);
            --accent-primary: #1da1f2;
            --text-primary: #fff;
            --text-secondary: #b0b3b8;
            --border-primary: #2c2f36;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            background: var(--bg-main);
            color: var(--text-primary);
            margin: 0;
            min-height: 100vh;
        }
        .topnav {
            background: var(--bg-card);
            border-bottom: 1px solid var(--border-primary);
            padding: 10px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .nav-logo { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--accent-primary); font-weight: 700; }
        .nav-logo img { width: 36px; height: 36px; }
        .container { max-width: 600px; margin: 24px auto; padding: 0 16px; }
        .req-item {
            background: var(--bg-card);
            border: 1px solid var(--border-primary);
            border-radius: 12px;
            padding: 14px 18px;
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 12px;
        }
        .req-avatar { width: 44px; height: 44px; border-radius: 50%; object-fit: cover; }
        .req-info { flex: 1; }
        .req-name { font-weight: 600; text-decoration: none; color: var(--text-primary); }
        .req-actions { display: flex; gap: 8px; }
        .btn-sm {
            padding: 6px 14px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            border: none;
        }
        .btn-accept { background: var(--accent-primary); color: #fff; }
        .btn-decline { background: #333; color: var(--text-secondary); }
    </style>
</head>
<body>

    <nav class="topnav">
        <a href="/index.html" class="nav-logo">
            <img src="/icon/p&c.png" alt="P&C">
            <span>People &amp; Culture</span>
        </a>
        <a href="/index.html" style="color: var(--text-secondary);"><i class="fa-solid fa-house"></i></a>
    </nav>

    <div class="container">
        <h1 style="font-size: 1.4rem; margin-bottom: 16px;">Co-worker Requests</h1>
        <div id="requestsList">
            <p style="text-align: center; color: var(--text-secondary);">Loading requests...</p>
        </div>
    </div>

    <script src="/js/api.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', loadRequests);

        async function loadRequests() {
            const list = document.getElementById('requestsList');
            try {
                const res = await API.getPendingRequests();
                list.innerHTML = '';
                if (!res.data || res.data.length === 0) {
                    list.innerHTML = '<p style="text-align: center; color: var(--text-secondary); padding: 40px;">No pending requests.</p>';
                    return;
                }

                res.data.forEach(u => {
                    const avatar = u.profilePic && u.profilePic.startsWith('http') ? u.profilePic : `/images/${u.profilePic || 'prof.png'}`;
                    const item = document.createElement('div');
                    item.className = 'req-item';
                    item.id = `req-${u.id}`;
                    item.innerHTML = `
                        <img class="req-avatar" src="${avatar}" alt="">
                        <div class="req-info">
                            <a href="/profile.html?userId=${u.id}" class="req-name">${u.fullName}</a>
                            <div style="font-size: 0.8rem; color: var(--text-secondary);">${u.place || 'Remote'}</div>
                        </div>
                        <div class="req-actions">
                            <button class="btn-sm btn-accept" onclick="accept('${u.id}')">Accept</button>
                            <button class="btn-sm btn-decline" onclick="decline('${u.id}')">Decline</button>
                        </div>
                    `;
                    list.appendChild(item);
                });
            } catch (err) {
                list.innerHTML = `<p style="color: #e0245e; text-align: center;">${err.message}</p>`;
            }
        }

        async function accept(userId) {
            await API.acceptCoworkerRequest(userId);
            showToast('Request accepted!');
            document.getElementById(`req-${userId}`)?.remove();
        }

        async function decline(userId) {
            await API.cancelCoworkerRequest(userId);
            showToast('Request declined.');
            document.getElementById(`req-${userId}`)?.remove();
        }
    </script>
</body>
</html>
