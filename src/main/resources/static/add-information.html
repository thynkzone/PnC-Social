<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" href="/icon/favicon.ico" type="image/x-icon">
    <title>Complete Profile - P&C</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="stylesheet" type="text/css" href="/css-pages.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-main: #18181b;
            --bg-card: rgba(36, 37, 46, 0.9);
            --accent-primary: #1da1f2;
            --accent-secondary: #0a8cd8;
            --accent-danger: #e0245e;
            --text-primary: #fff;
            --text-secondary: #b0b3b8;
            --border-primary: #2c2f36;
        }
        body {
            background: var(--bg-main);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .setup-card {
            background: var(--bg-card);
            border: 1px solid var(--border-primary);
            border-radius: 16px;
            padding: 36px;
            width: 100%;
            max-width: 520px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }
        h1 {
            font-size: 1.5rem;
            margin-bottom: 6px;
            text-align: center;
        }
        p.subtitle {
            color: var(--text-secondary);
            font-size: 0.9rem;
            text-align: center;
            margin-bottom: 24px;
        }
        .form-row {
            display: flex;
            gap: 16px;
            margin-bottom: 16px;
        }
        .form-group {
            flex: 1;
            margin-bottom: 16px;
        }
        label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }
        input, select, textarea {
            width: 100%;
            background: #23232a;
            border: 1.5px solid var(--border-primary);
            border-radius: 8px;
            padding: 10px 14px;
            color: var(--text-primary);
            font-size: 0.95rem;
            outline: none;
            box-sizing: border-box;
        }
        input:focus, select:focus, textarea:focus {
            border-color: var(--accent-primary);
        }
        .btn-submit {
            width: 100%;
            background: var(--accent-primary);
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 14px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="setup-card">
        <h1>Set Up Your Profile</h1>
        <p class="subtitle">Tell your coworkers a little about yourself</p>

        <form id="setupForm" onsubmit="handleProfileSetup(event)">
            <div class="form-row">
                <div class="form-group">
                    <label for="firstName">First Name</label>
                    <input type="text" id="firstName" required placeholder="John">
                </div>
                <div class="form-group">
                    <label for="lastName">Last Name</label>
                    <input type="text" id="lastName" required placeholder="Doe">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="gender">Gender</label>
                    <select id="gender">
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                        <option value="Other">Other</option>
                        <option value="Prefer not to say">Prefer not to say</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="birthDate">Birth Date</label>
                    <input type="date" id="birthDate">
                </div>
            </div>

            <div class="form-group">
                <label for="about">About / Bio</label>
                <textarea id="about" rows="3" placeholder="What are your passions, projects, or work roles?"></textarea>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="country">Country</label>
                    <input type="text" id="country" placeholder="United States">
                </div>
                <div class="form-group">
                    <label for="place">City / Workplace Location</label>
                    <input type="text" id="place" placeholder="New York, NY">
                </div>
            </div>

            <button type="submit" id="submitBtn" class="btn-submit">Complete Profile &amp; Go to Feed</button>
        </form>
    </div>

    <script src="/js/api.js"></script>
    <script>
        async function handleProfileSetup(e) {
            e.preventDefault();
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.innerText = 'Saving...';

            const payload = {
                firstName: document.getElementById('firstName').value.trim(),
                lastName: document.getElementById('lastName').value.trim(),
                gender: document.getElementById('gender').value,
                birthDate: document.getElementById('birthDate').value,
                about: document.getElementById('about').value.trim(),
                country: document.getElementById('country').value.trim(),
                place: document.getElementById('place').value.trim(),
                timezone: Intl.DateTimeFormat().resolvedOptions().timeZone || 'UTC'
            };

            try {
                const res = await API.updateProfile(payload);
                if (res.success) {
                    showToast('Profile completed!');
                    window.location.href = '/index.html';
                }
            } catch (err) {
                showToast(err.message, true);
                submitBtn.disabled = false;
                submitBtn.innerText = 'Complete Profile & Go to Feed';
            }
        }
    </script>
</body>
</html>
