<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" href="/icon/favicon.ico" type="image/x-icon">
    <title>Set Up Profile - P&amp;C</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/modern-ui.css">
</head>
<body class="li-auth-page" style="padding: 40px 16px;">

    <!-- Top Logo Only for Title / Branding -->
    <div style="margin-bottom: 24px; text-align: center;">
        <a href="/index.html" class="li-logo-link" title="Home">
            <img src="/icon/p&c.png" alt="Logo" style="width: 48px; height: 48px; border-radius: 8px;">
        </a>
    </div>

    <div class="li-auth-card" style="max-width: 520px; text-align: left;">
        <h1 class="li-auth-title" style="text-align: center;">Set Up Your Profile</h1>
        <p class="li-auth-subtitle" style="text-align: center;">Tell your coworkers and network about yourself</p>

        <form id="setupForm" onsubmit="handleProfileSetup(event)">
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 14px;">
                <div class="li-form-group" style="margin-bottom: 0;">
                    <label class="li-label" for="firstName">First Name</label>
                    <input type="text" id="firstName" class="li-input" required placeholder="John">
                </div>
                <div class="li-form-group" style="margin-bottom: 0;">
                    <label class="li-label" for="lastName">Last Name</label>
                    <input type="text" id="lastName" class="li-input" required placeholder="Doe">
                </div>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 14px;">
                <div class="li-form-group" style="margin-bottom: 0;">
                    <label class="li-label" for="gender">Gender</label>
                    <select id="gender" class="li-select">
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                        <option value="Other">Other</option>
                        <option value="Prefer not to say">Prefer not to say</option>
                    </select>
                </div>
                <div class="li-form-group" style="margin-bottom: 0;">
                    <label class="li-label" for="birthDate">Birth Date</label>
                    <input type="date" id="birthDate" class="li-input">
                </div>
            </div>

            <div class="li-form-group">
                <label class="li-label" for="about">About / Headline &amp; Summary</label>
                <textarea id="about" class="li-textarea" rows="3" placeholder="What are your skills, projects, or work roles?"></textarea>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 20px;">
                <div class="li-form-group" style="margin-bottom: 0;">
                    <label class="li-label" for="country">Country</label>
                    <input type="text" id="country" class="li-input" placeholder="Bangladesh">
                </div>
                <div class="li-form-group" style="margin-bottom: 0;">
                    <label class="li-label" for="place">City / Workplace Location</label>
                    <input type="text" id="place" class="li-input" placeholder="Dhaka">
                </div>
            </div>

            <button type="submit" id="submitBtn" class="li-btn-primary" style="width: 100%; padding: 12px; font-size: 15px;">
                Complete Profile &amp; Go to Feed
            </button>
        </form>
    </div>

    <!-- Mini Footer -->
    <div style="margin-top: 28px; text-align: center; font-size: 11px; color: var(--li-text-muted);">
        <div class="li-footer-links" style="margin-bottom: 6px;">
            <a href="/about-us.html">About</a>
            <a href="/support.html">Help Center</a>
            <a href="/terms-and-conditions.html">Privacy &amp; Terms</a>
        </div>
        <span>People &amp; Culture &copy; 2026</span>
    </div>

    <script src="/js/api.js"></script>
    <script>
        async function handleProfileSetup(e) {
            e.preventDefault();
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.innerText = 'Saving...';

            const payload = {
                firstName: document.getElementById('firstName').value.trim(),
                lastName: document.getElementById('lastName').value.trim(),
                gender: document.getElementById('gender').value,
                birthDate: document.getElementById('birthDate').value,
                about: document.getElementById('about').value.trim(),
                country: document.getElementById('country').value.trim(),
                place: document.getElementById('place').value.trim(),
                timezone: Intl.DateTimeFormat().resolvedOptions().timeZone || 'UTC'
            };

            try {
                const res = await API.updateProfile(payload);
                if (res.success) {
                    showToast('Profile completed!');
                    window.location.href = '/index.html';
                }
            } catch (err) {
                showToast(err.message || 'Failed to update profile', true);
                submitBtn.disabled = false;
                submitBtn.innerText = 'Complete Profile & Go to Feed';
            }
        }
    </script>
</body>
</html>
