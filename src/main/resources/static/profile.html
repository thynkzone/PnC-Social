<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" href="/icon/favicon.ico" type="image/x-icon">
    <title>Profile - P&amp;C</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#1d2226">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/modern-ui.css">
    <style>
        .profile-container {
            max-width: 900px;
            margin: 20px auto 40px;
            padding: 0 16px;
        }

        /* LinkedIn Cover & Avatar Header */
        .profile-header-card {
            position: relative;
            overflow: visible;
        }
        .cover-photo-wrap {
            position: relative;
            width: 100%;
            height: 200px;
            background: linear-gradient(135deg, #0a66c2 0%, #004182 60%, #1d2226 100%);
            border-top-left-radius: var(--li-radius-lg);
            border-top-right-radius: var(--li-radius-lg);
            overflow: hidden;
        }
        .cover-photo-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .cover-edit-btn {
            position: absolute;
            top: 16px;
            right: 16px;
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(8px);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: var(--li-radius-pill);
            padding: 6px 14px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            display: none;
            align-items: center;
            gap: 6px;
            transition: background 0.15s ease;
        }
        .cover-edit-btn:hover {
            background: rgba(0, 0, 0, 0.85);
        }

        .avatar-edit-wrap {
            position: relative;
            width: 140px;
            height: 140px;
            margin-top: -80px;
            margin-left: 24px;
            display: inline-block;
        }
        .avatar-img-main {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            border: 4px solid var(--li-bg-surface);
            object-fit: cover;
            background: var(--li-bg-surface);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
        }
        .avatar-edit-btn {
            position: absolute;
            right: 4px;
            bottom: 6px;
            background: var(--li-primary);
            color: #fff;
            border: 3px solid var(--li-bg-surface);
            border-radius: 50%;
            width: 36px;
            height: 36px;
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            transition: background 0.15s;
        }
        .avatar-edit-btn:hover {
            background: var(--li-primary-hover);
        }

        .profile-body {
            padding: 12px 24px 24px;
        }
        .profile-top-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            flex-wrap: wrap;
            gap: 16px;
        }
        .profile-headline-area {
            flex: 1;
            min-width: 260px;
        }
        .profile-full-name {
            font-size: 24px;
            font-weight: 700;
            color: #fff;
            margin-bottom: 4px;
        }
        .profile-badge-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }
        .profile-rank-tag {
            background: var(--li-primary-soft);
            color: var(--li-primary);
            padding: 3px 10px;
            border-radius: 14px;
            font-size: 12px;
            font-weight: 600;
        }
        .profile-location-text {
            color: var(--li-text-secondary);
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .profile-about-text {
            color: var(--li-text-primary);
            font-size: 14px;
            line-height: 1.6;
            margin-top: 14px;
            white-space: pre-wrap;
        }

        /* Analytics / Stats Bar */
        .profile-analytics-bar {
            display: flex;
            border-top: 1px solid var(--li-border-light);
            margin-top: 20px;
            padding-top: 16px;
            gap: 32px;
            flex-wrap: wrap;
        }
        .profile-stat-box {
            text-align: left;
        }
        .profile-stat-num {
            font-size: 18px;
            font-weight: 700;
            color: #fff;
        }
        .profile-stat-label {
            font-size: 12px;
            color: var(--li-text-secondary);
            margin-top: 2px;
        }

        /* Timeline / Activity Section */
        .activity-card {
            padding: 20px 24px;
        }
        .activity-title {
            font-size: 18px;
            font-weight: 700;
            color: #fff;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .activity-item {
            border: 1px solid var(--li-border-light);
            border-radius: var(--li-radius-md);
            background: var(--li-bg-elevated);
            padding: 16px;
            margin-bottom: 12px;
        }
        .activity-meta {
            font-size: 12px;
            color: var(--li-text-muted);
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .activity-body {
            font-size: 14px;
            color: var(--li-text-primary);
            line-height: 1.5;
            white-space: pre-wrap;
            margin-bottom: 10px;
        }
        .activity-media {
            width: 100%;
            max-height: 380px;
            object-fit: cover;
            border-radius: var(--li-radius-sm);
            margin-bottom: 10px;
        }
        .activity-reactions {
            font-size: 12px;
            color: var(--li-text-secondary);
            display: flex;
            gap: 16px;
        }
    </style>
</head>
<body>

    <!-- LinkedIn Top Navbar (Logo Only for branding) -->
    <header class="li-navbar">
        <div class="li-nav-inner">
            <div class="li-nav-left">
                <!-- Only logo for title/brand, no text -->
                <a href="/index.html" class="li-logo-link" title="P&amp;C Home">
                    <img src="/icon/p&c.png" alt="P&amp;C" class="li-logo-img">
                </a>
                
                <div class="li-search-box">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" id="globalNavSearch" class="li-search-input" placeholder="Search people, topics..." onkeydown="if(event.key==='Enter') window.location.href='/search-user.html?q='+encodeURIComponent(this.value)">
                </div>
            </div>

            <nav class="li-nav-menu">
                <a href="/index.html" class="li-nav-item" title="Home Feed">
                    <i class="fa-solid fa-house"></i>
                    <span>Home</span>
                </a>
                <a href="/following.html" class="li-nav-item" title="My Network">
                    <i class="fa-solid fa-user-group"></i>
                    <span>My Network</span>
                </a>
                <a href="/advertisements.html" class="li-nav-item" title="Ads &amp; Campaigns">
                    <i class="fa-solid fa-bullhorn"></i>
                    <span>Ads</span>
                </a>
                <a href="/post-updates.html" class="li-nav-item" title="Notifications">
                    <i class="fa-solid fa-bell"></i>
                    <span>Notifications</span>
                </a>
                
                <!-- Authenticated User Dropdown -->
                <div class="li-nav-item" id="navMeItem" style="display: none;" onclick="toggleMeDropdown(event)">
                    <img id="navAvatar" class="li-nav-avatar" src="/images/prof.png" alt="Profile">
                    <span style="display: flex; align-items: center; gap: 2px;">Me <i class="fa-solid fa-caret-down" style="font-size: 9px;"></i></span>

                    <div class="li-dropdown-menu" id="meDropdownMenu">
                        <div style="padding: 10px 16px; display: flex; gap: 10px; align-items: center;">
                            <img id="menuAvatar" style="width: 40px; height: 40px; border-radius: 50%; object-fit: cover;" src="/images/prof.png" alt="User">
                            <div style="min-width: 0;">
                                <div id="menuName" style="font-weight: 700; font-size: 13px; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">User</div>
                                <div id="menuHeadline" style="font-size: 11px; color: var(--li-text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">Professional</div>
                            </div>
                        </div>
                        <div class="li-dropdown-divider"></div>
                        <a href="/profile.html" id="menuProfileLink" class="li-dropdown-item"><i class="fa-solid fa-user"></i> View Profile</a>
                        <a href="/view-all-requests.html" class="li-dropdown-item"><i class="fa-solid fa-user-clock"></i> Pending Requests</a>
                        <a href="/settings.html" class="li-dropdown-item"><i class="fa-solid fa-gear"></i> Settings &amp; Privacy</a>
                        <div class="li-dropdown-divider"></div>
                        <a href="javascript:void(0)" onclick="handleLogout()" class="li-dropdown-item" style="color: var(--li-danger);"><i class="fa-solid fa-right-from-bracket"></i> Sign Out</a>
                    </div>
                </div>

                <a href="/login.html" id="navLoginBtn" class="li-btn-primary" style="margin-left: 8px; font-size: 13px; padding: 6px 16px;">
                    Sign In
                </a>
            </nav>
        </div>
    </header>

    <div class="profile-container">

        <!-- Top Header & Back Button -->
        <div style="margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between;">
            <button onclick="if(history.length>1){history.back()}else{window.location.href='/index.html'}" class="li-back-btn">
                <i class="fa-solid fa-arrow-left"></i> Back to Feed
            </button>
        </div>

        <!-- Profile Hero Card -->
        <div class="li-card profile-header-card">
            <!-- Cover Photo (Solid Blue by default) -->
            <div class="cover-photo-wrap" style="background-color: #0a66c2;">
                <img id="coverImg" class="cover-photo-img" style="display: none;" alt="Cover photo">
                <button id="coverUploadBtn" type="button" class="cover-edit-btn" onclick="document.getElementById('coverFileInput').click()">
                    <i class="fa-solid fa-camera"></i> Change cover
                </button>
                <input type="file" id="coverFileInput" accept="image/*" style="display: none;" onchange="handleCoverUpload(event)">
            </div>

            <!-- Avatar & Action Buttons Bar -->
            <div style="display: flex; justify-content: space-between; align-items: flex-end; padding: 0 24px; position: relative;">
                <div class="avatar-edit-wrap">
                    <img id="profileAvatar" class="avatar-img-main" src="/images/prof.png" alt="Profile avatar">
                    <button id="avatarUploadBtn" type="button" class="avatar-edit-btn" onclick="document.getElementById('avatarFileInput').click()">
                        <i class="fa-solid fa-camera"></i>
                    </button>
                    <input type="file" id="avatarFileInput" accept="image/*" style="display: none;" onchange="handleAvatarUpload(event)">
                </div>

                <div id="actionButtons" style="display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap;"></div>
            </div>

            <!-- Profile Info Body -->
            <div class="profile-body">
                <div class="profile-top-row">
                    <div class="profile-headline-area">
                        <h1 class="profile-full-name" id="profileName">Loading Profile...</h1>
                        <div class="profile-badge-row">
                            <span class="profile-rank-tag" id="profileRank">Novice</span>
                        </div>
                        <div class="profile-location-text">
                            <span id="profilePlace"><i class="fa-solid fa-location-dot"></i> Workplace</span>
                            <span>&bull;</span>
                            <span id="profileCountry"><i class="fa-solid fa-globe"></i> Country</span>
                        </div>
                    </div>
                </div>

                <div class="profile-about-text" id="profileAbout"></div>

                <!-- Stats Bar -->
                <div class="profile-analytics-bar">
                    <div class="profile-stat-box">
                        <div class="profile-stat-num" id="statPosts">0</div>
                        <div class="profile-stat-label">Posts</div>
                    </div>
                    <div class="profile-stat-box">
                        <div class="profile-stat-num" id="statCoworkers">0</div>
                        <div class="profile-stat-label">Co-workers</div>
                    </div>
                    <div class="profile-stat-box">
                        <div class="profile-stat-num" id="statFollowers">0</div>
                        <div class="profile-stat-label">Followers</div>
                    </div>
                    <div class="profile-stat-box">
                        <div class="profile-stat-num" id="statFollowing">0</div>
                        <div class="profile-stat-label">Following</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Activity & Posts Card -->
        <div class="li-card activity-card">
            <div class="activity-title">
                <span>Activity &amp; Contributions</span>
            </div>
            <div id="userTimeline">
                <p style="color: var(--li-text-muted); text-align: center; padding: 30px;">Loading posts...</p>
            </div>
        </div>

    </div>

    <script src="/js/api.js?v=2.2"></script>
    <script>
        let currentAuthUser = null;
        let viewedUserId = null;
        let cachedProfile = null;

        document.addEventListener('DOMContentLoaded', async () => {
            const urlParams = new URLSearchParams(window.location.search);
            viewedUserId = urlParams.get('userId');

            try {
                const meRes = await API.getCurrentUser();
                if (meRes && meRes.success) {
                    currentAuthUser = meRes.data;
                    setupNavbarMe(currentAuthUser);
                    if (!viewedUserId) viewedUserId = currentAuthUser.id;
                }
            } catch (err) {}

            if (!viewedUserId) {
                window.location.href = '/login.html';
                return;
            }

            await loadProfile(viewedUserId);
            await loadUserPosts(viewedUserId);
        });

        function setupNavbarMe(user) {
            document.getElementById('navLoginBtn').style.display = 'none';
            const navMe = document.getElementById('navMeItem');
            navMe.style.display = 'flex';
            if (user.profilePic) {
                const pic = user.profilePic.startsWith('http') ? user.profilePic : `/images/${user.profilePic}`;
                document.getElementById('navAvatar').src = pic;
                document.getElementById('menuAvatar').src = pic;
            }
            document.getElementById('menuName').innerText = user.fullName || 'User';
            document.getElementById('menuHeadline').innerText = `${user.rank || 'Member'} • ${user.rating || 0} pts`;
            document.getElementById('menuProfileLink').href = `/profile.html?userId=${user.id}`;
        }

        function toggleMeDropdown(e) {
            e.stopPropagation();
            const menu = document.getElementById('meDropdownMenu');
            menu.classList.toggle('show');
        }

        document.addEventListener('click', () => {
            const menu = document.getElementById('meDropdownMenu');
            if (menu) menu.classList.remove('show');
        });

        async function handleLogout() {
            try {
                await API.logout();
            } finally {
                window.location.href = '/login.html';
            }
        }

        async function loadProfile(userId) {
            try {
                const res = await API.getUserProfile(userId);
                const p = res.data;

                document.getElementById('profileName').innerText = p.fullName || 'User';
                document.getElementById('profileRank').innerText = `${p.rank || 'Novice'} • ${p.rating || 0} Points`;
                document.getElementById('profileAbout').innerText = p.about || 'No bio specified yet.';
                document.getElementById('profilePlace').innerHTML = `<i class="fa-solid fa-location-dot"></i> ${p.place || 'Remote'}`;
                document.getElementById('profileCountry').innerHTML = `<i class="fa-solid fa-globe"></i> ${p.country || 'Global'}`;

                document.getElementById('statPosts').innerText = p.postsCount || 0;
                document.getElementById('statCoworkers').innerText = p.coworkersCount || 0;
                document.getElementById('statFollowers').innerText = p.followersCount || 0;
                document.getElementById('statFollowing').innerText = p.followingCount || 0;

                if (p.profilePic) {
                    document.getElementById('profileAvatar').src = p.profilePic.startsWith('http') ? p.profilePic : `/images/${p.profilePic}`;
                }
                if (p.backgroundPic && !p.backgroundPic.includes('prof.png')) {
                    const coverEl = document.getElementById('coverImg');
                    coverEl.src = p.backgroundPic.startsWith('http') ? p.backgroundPic : `/images/${p.backgroundPic}`;
                    coverEl.style.display = 'block';
                } else {
                    document.getElementById('coverImg').style.display = 'none';
                }

                cachedProfile = p;
                renderActionButtons(p);
            } catch (err) {
                showToast(err.message, true);
            }
        }

        function renderActionButtons(p) {
            const container = document.getElementById('actionButtons');
            container.innerHTML = '';
            const coverBtn = document.getElementById('coverUploadBtn');
            const avatarBtn = document.getElementById('avatarUploadBtn');

            if (currentAuthUser && currentAuthUser.id === viewedUserId) {
                if (coverBtn) coverBtn.style.display = 'inline-flex';
                if (avatarBtn) avatarBtn.style.display = 'inline-flex';
                container.innerHTML = `<a href="/settings.html" class="li-btn-secondary"><i class="fa-solid fa-gear"></i> Edit Profile</a>`;
                return;
            }

            if (coverBtn) coverBtn.style.display = 'none';
            if (avatarBtn) avatarBtn.style.display = 'none';

            if (!currentAuthUser) {
                container.innerHTML = `<a href="/login.html" class="li-btn-primary">Sign in to connect</a>`;
                return;
            }

            const isCoworker = Boolean(p.isCoworker || p.coworker);
            const isRequestSent = Boolean(p.isRequestSent || p.requestSent);
            const isRequestReceived = Boolean(p.isRequestReceived || p.requestReceived);
            const isFollowing = Boolean(p.isFollowing || p.following);

            // Coworker button
            if (isCoworker) {
                container.innerHTML += `<button class="li-btn-secondary" onclick="disconnectCoworker()"><i class="fa-solid fa-user-check"></i> Co-worker</button>`;
            } else if (isRequestSent) {
                container.innerHTML += `<button class="li-btn-secondary" onclick="cancelRequest()"><i class="fa-solid fa-clock"></i> Request Sent</button>`;
            } else if (isRequestReceived) {
                container.innerHTML += `<button class="li-btn-primary" onclick="acceptRequest()"><i class="fa-solid fa-user-plus"></i> Accept Request</button>`;
            } else {
                container.innerHTML += `<button class="li-btn-primary" onclick="sendRequest()"><i class="fa-solid fa-user-plus"></i> Add Co-worker</button>`;
            }

            // Follow button
            if (isFollowing) {
                container.innerHTML += `<button class="li-btn-secondary" onclick="unfollow()"><i class="fa-solid fa-check"></i> Following</button>`;
            } else {
                container.innerHTML += `<button class="li-btn-secondary" onclick="follow()"><i class="fa-solid fa-plus"></i> Follow</button>`;
            }
        }

        async function loadUserPosts(userId) {
            try {
                const res = await API.getUserPosts(userId, 0, 20);
                const container = document.getElementById('userTimeline');
                container.innerHTML = '';

                if (!res.data || !res.data.content || res.data.content.length === 0) {
                    container.innerHTML = '<p style="text-align: center; color: var(--li-text-muted); padding: 30px;">No posts published yet.</p>';
                    return;
                }

                res.data.content.forEach(post => {
                    const item = document.createElement('div');
                    item.className = 'activity-item';
                    item.innerHTML = `
                        <div class="activity-meta">
                            <i class="fa-regular fa-clock"></i> ${post.timeAgo || 'Recently'}
                            ${post.isFact ? '<span style="background: rgba(16,185,129,0.15); color: #10b981; padding: 1px 6px; border-radius: 8px; font-weight: 600; font-size: 11px;">Fact</span>' : ''}
                        </div>
                        <div class="activity-body">${post.content}</div>
                        ${post.imageUrl ? `<img src="${post.imageUrl}" class="activity-media" alt="Post media">` : ''}
                        <div class="activity-reactions">
                            <span><i class="fa-solid fa-thumbs-up" style="color: var(--li-primary);"></i> ${post.likesCount || 0} Likes</span>
                            <span><i class="fa-solid fa-comment" style="color: var(--li-text-secondary);"></i> ${post.commentsCount || 0} Comments</span>
                        </div>
                    `;
                    container.appendChild(item);
                });
            } catch (err) {}
        }

        async function sendRequest() {
            if (cachedProfile) {
                cachedProfile.isRequestSent = true;
                cachedProfile.requestSent = true;
                renderActionButtons(cachedProfile);
            }
            try {
                await API.sendCoworkerRequest(viewedUserId);
                showToast('Co-worker request sent!');
            } catch (err) {
                showToast(err.message, true);
            }
            loadProfile(viewedUserId);
        }

        async function acceptRequest() {
            if (cachedProfile) {
                cachedProfile.isCoworker = true;
                cachedProfile.coworker = true;
                cachedProfile.isRequestReceived = false;
                renderActionButtons(cachedProfile);
            }
            try {
                await API.acceptCoworkerRequest(viewedUserId);
                showToast('Connected as co-workers!');
            } catch (err) {
                showToast(err.message, true);
            }
            loadProfile(viewedUserId);
        }

        async function cancelRequest() {
            if (cachedProfile) {
                cachedProfile.isRequestSent = false;
                cachedProfile.requestSent = false;
                renderActionButtons(cachedProfile);
            }
            try {
                await API.cancelCoworkerRequest(viewedUserId);
                showToast('Request cancelled.');
            } catch (err) {
                showToast(err.message, true);
            }
            loadProfile(viewedUserId);
        }

        async function disconnectCoworker() {
            if (!confirm('Disconnect from this co-worker?')) return;
            if (cachedProfile) {
                cachedProfile.isCoworker = false;
                cachedProfile.coworker = false;
                renderActionButtons(cachedProfile);
            }
            try {
                await API.disconnectCoworker(viewedUserId);
                showToast('Disconnected.');
            } catch (err) {
                showToast(err.message, true);
            }
            loadProfile(viewedUserId);
        }

        async function follow() {
            if (cachedProfile) {
                cachedProfile.isFollowing = true;
                cachedProfile.following = true;
                renderActionButtons(cachedProfile);
            }
            try {
                await API.follow(viewedUserId);
                showToast('Now following!');
            } catch (err) {
                showToast(err.message, true);
            }
            loadProfile(viewedUserId);
        }

        async function unfollow() {
            if (cachedProfile) {
                cachedProfile.isFollowing = false;
                cachedProfile.following = false;
                renderActionButtons(cachedProfile);
            }
            try {
                await API.unfollow(viewedUserId);
                showToast('Unfollowed.');
            } catch (err) {
                showToast(err.message, true);
            }
            loadProfile(viewedUserId);
        }

        async function handleAvatarUpload(event) {
            const file = event.target.files && event.target.files[0];
            if (!file) return;
            try {
                showToast('Uploading profile picture...');
                const uploadRes = await API.uploadImage(file, 'profiles');
                if (!uploadRes || !uploadRes.downloadUrl) {
                    throw new Error('Upload failed: No image URL returned');
                }
                await API.updateProfilePicture(uploadRes.downloadUrl);
                document.getElementById('profileAvatar').src = uploadRes.downloadUrl;
                showToast('Profile picture updated!');
            } catch (err) {
                showToast(err.message || 'Failed to upload profile picture', true);
            } finally {
                event.target.value = '';
            }
        }

        async function handleCoverUpload(event) {
            const file = event.target.files && event.target.files[0];
            if (!file) return;
            try {
                showToast('Uploading cover photo...');
                const uploadRes = await API.uploadImage(file, 'covers');
                if (!uploadRes || !uploadRes.downloadUrl) {
                    throw new Error('Upload failed: No image URL returned');
                }
                await API.updateBackgroundPicture(uploadRes.downloadUrl);
                document.getElementById('coverImg').src = uploadRes.downloadUrl;
                showToast('Cover photo updated!');
            } catch (err) {
                showToast(err.message || 'Failed to upload cover photo', true);
            } finally {
                event.target.value = '';
            }
        }
    </script>
</body>
</html>
