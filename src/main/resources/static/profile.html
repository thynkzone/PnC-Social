<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" href="/icon/favicon.ico" type="image/x-icon">
    <title>Profile - P&C</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="stylesheet" type="text/css" href="/css-pages.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-main: #18181b;
            --bg-card: rgba(36, 37, 46, 0.85);
            --bg-tertiary: #23232a;
            --accent-primary: #1da1f2;
            --accent-danger: #e0245e;
            --text-primary: #fff;
            --text-secondary: #b0b3b8;
            --text-muted: #888;
            --border-primary: #2c2f36;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            background: var(--bg-main);
            color: var(--text-primary);
            margin: 0;
            min-height: 100vh;
        }
        .topnav {
            background: var(--bg-card);
            border-bottom: 1px solid var(--border-primary);
            padding: 10px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .nav-logo {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: var(--accent-primary);
            font-weight: 700;
            font-size: 1.2rem;
        }
        .nav-logo img { width: 36px; height: 36px; }
        .nav-links { display: flex; align-items: center; gap: 20px; }
        .nav-link { color: var(--text-secondary); font-size: 1.2rem; text-decoration: none; }
        .nav-link:hover, .nav-link.active { color: var(--accent-primary); }
        .profile-container {
            max-width: 720px;
            margin: 0 auto 40px auto;
            padding: 0 16px;
        }
        .cover-photo {
            width: 100%;
            height: 180px;
            background: #27272a;
            border-radius: 0 0 12px 12px;
            object-fit: cover;
        }
        .profile-card {
            background: var(--bg-card);
            border: 1px solid var(--border-primary);
            border-radius: 12px;
            padding: 24px;
            margin-top: -60px;
            position: relative;
            box-shadow: 0 4px 16px rgba(0,0,0,0.3);
        }
        .avatar-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 16px;
        }
        .avatar-img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 4px solid var(--bg-main);
            object-fit: cover;
            background: #333;
        }
        .action-btns {
            display: flex;
            gap: 10px;
        }
        .btn-action {
            background: var(--accent-primary);
            color: #fff;
            border: none;
            padding: 8px 18px;
            border-radius: 20px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            font-size: 0.9rem;
        }
        .btn-secondary {
            background: var(--bg-tertiary);
            color: var(--text-primary);
            border: 1px solid var(--border-primary);
        }
        .user-name {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 4px;
        }
        .rank-badge {
            display: inline-block;
            background: rgba(29, 161, 242, 0.15);
            color: var(--accent-primary);
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: 600;
            margin-bottom: 12px;
        }
        .user-bio {
            color: var(--text-secondary);
            font-size: 0.95rem;
            line-height: 1.5;
            margin-bottom: 16px;
        }
        .user-meta {
            display: flex;
            gap: 20px;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 20px;
        }
        .stats-bar {
            display: flex;
            gap: 28px;
            padding-top: 16px;
            border-top: 1px solid var(--border-primary);
        }
        .stat-item {
            text-align: center;
        }
        .stat-num {
            font-weight: 700;
            font-size: 1.1rem;
            color: var(--text-primary);
        }
        .stat-label {
            font-size: 0.8rem;
            color: var(--text-secondary);
        }
        .timeline-section {
            margin-top: 24px;
        }
        .timeline-title {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 16px;
        }
        .post-card {
            background: var(--bg-card);
            border-radius: 12px;
            border: 1px solid var(--border-primary);
            padding: 18px;
            margin-bottom: 16px;
        }
    </style>
</head>
<body>

    <nav class="topnav">
        <a href="/index.html" class="nav-logo">
            <img src="/icon/p&c.png" alt="P&C Logo">
            <span>People &amp; Culture</span>
        </a>
        <div class="nav-links">
            <a href="/index.html" class="nav-link"><i class="fa-solid fa-house"></i></a>
            <a href="/following.html" class="nav-link"><i class="fa-solid fa-user-group"></i></a>
            <a href="/post-updates.html" class="nav-link"><i class="fa-solid fa-bell"></i></a>
            <a href="/settings.html" class="nav-link"><i class="fa-solid fa-gear"></i></a>
        </div>
    </nav>

    <div class="profile-container">
        <img id="coverImg" class="cover-photo" src="/images/prof.png" alt="Cover">

        <div class="profile-card">
            <div class="avatar-row">
                <img id="profileAvatar" class="avatar-img" src="/images/prof.png" alt="Profile avatar">
                <div class="action-btns" id="actionButtons"></div>
            </div>

            <div class="user-name" id="profileName">Loading...</div>
            <div class="rank-badge" id="profileRank">Rank</div>
            <div class="user-bio" id="profileAbout"></div>

            <div class="user-meta">
                <span id="profilePlace"><i class="fa-solid fa-location-dot"></i> Workplace</span>
                <span id="profileCountry"><i class="fa-solid fa-globe"></i> Country</span>
            </div>

            <div class="stats-bar">
                <div class="stat-item">
                    <div class="stat-num" id="statPosts">0</div>
                    <div class="stat-label">Posts</div>
                </div>
                <div class="stat-item">
                    <div class="stat-num" id="statCoworkers">0</div>
                    <div class="stat-label">Co-workers</div>
                </div>
                <div class="stat-item">
                    <div class="stat-num" id="statFollowers">0</div>
                    <div class="stat-label">Followers</div>
                </div>
                <div class="stat-item">
                    <div class="stat-num" id="statFollowing">0</div>
                    <div class="stat-label">Following</div>
                </div>
            </div>
        </div>

        <div class="timeline-section">
            <div class="timeline-title">Posts &amp; Contributions</div>
            <div id="userTimeline">
                <p style="color: var(--text-muted); text-align: center;">Loading posts...</p>
            </div>
        </div>
    </div>

    <script src="/js/api.js"></script>
    <script>
        let currentAuthUser = null;
        let viewedUserId = null;

        document.addEventListener('DOMContentLoaded', async () => {
            const urlParams = new URLSearchParams(window.location.search);
            viewedUserId = urlParams.get('userId');

            try {
                const meRes = await API.getCurrentUser();
                if (meRes && meRes.success) {
                    currentAuthUser = meRes.data;
                    if (!viewedUserId) viewedUserId = currentAuthUser.id;
                }
            } catch (err) {}

            if (!viewedUserId) {
                window.location.href = '/login.html';
                return;
            }

            await loadProfile(viewedUserId);
            await loadUserPosts(viewedUserId);
        });

        async function loadProfile(userId) {
            try {
                const res = await API.getUserProfile(userId);
                const p = res.data;

                document.getElementById('profileName').innerText = p.fullName || 'User';
                document.getElementById('profileRank').innerText = `${p.rank || 'Novice'} • ${p.rating || 0} Points`;
                document.getElementById('profileAbout').innerText = p.about || 'No bio yet.';
                document.getElementById('profilePlace').innerHTML = `<i class="fa-solid fa-location-dot"></i> ${p.place || 'Remote'}`;
                document.getElementById('profileCountry').innerHTML = `<i class="fa-solid fa-globe"></i> ${p.country || 'Global'}`;

                document.getElementById('statPosts').innerText = p.postsCount || 0;
                document.getElementById('statCoworkers').innerText = p.coworkersCount || 0;
                document.getElementById('statFollowers').innerText = p.followersCount || 0;
                document.getElementById('statFollowing').innerText = p.followingCount || 0;

                if (p.profilePic) {
                    document.getElementById('profileAvatar').src = p.profilePic.startsWith('http') ? p.profilePic : `/images/${p.profilePic}`;
                }
                if (p.backgroundPic) {
                    document.getElementById('coverImg').src = p.backgroundPic.startsWith('http') ? p.backgroundPic : `/images/${p.backgroundPic}`;
                }

                renderActionButtons(p);
            } catch (err) {
                showToast(err.message, true);
            }
        }

        function renderActionButtons(p) {
            const container = document.getElementById('actionButtons');
            container.innerHTML = '';

            if (currentAuthUser && currentAuthUser.id === viewedUserId) {
                container.innerHTML = `<a href="/settings.html" class="btn-action btn-secondary"><i class="fa-solid fa-gear"></i> Edit Profile</a>`;
                return;
            }

            if (!currentAuthUser) {
                container.innerHTML = `<a href="/login.html" class="btn-action">Follow</a>`;
                return;
            }

            // Coworker button
            if (p.coworker) {
                container.innerHTML += `<button class="btn-action btn-secondary" onclick="disconnectCoworker()"><i class="fa-solid fa-user-check"></i> Co-worker</button>`;
            } else if (p.requestSent) {
                container.innerHTML += `<button class="btn-action btn-secondary" onclick="cancelRequest()"><i class="fa-solid fa-clock"></i> Request Sent</button>`;
            } else if (p.requestReceived) {
                container.innerHTML += `<button class="btn-action" onclick="acceptRequest()"><i class="fa-solid fa-user-plus"></i> Accept Request</button>`;
            } else {
                container.innerHTML += `<button class="btn-action" onclick="sendRequest()"><i class="fa-solid fa-user-plus"></i> Add Co-worker</button>`;
            }

            // Follow button
            if (p.following) {
                container.innerHTML += `<button class="btn-action btn-secondary" onclick="unfollow()"><i class="fa-solid fa-check"></i> Following</button>`;
            } else {
                container.innerHTML += `<button class="btn-action" onclick="follow()"><i class="fa-solid fa-plus"></i> Follow</button>`;
            }
        }

        async function loadUserPosts(userId) {
            try {
                const res = await API.getUserPosts(userId, 0, 20);
                const container = document.getElementById('userTimeline');
                container.innerHTML = '';

                if (!res.data || !res.data.content || res.data.content.length === 0) {
                    container.innerHTML = '<p style="text-align: center; color: var(--text-muted); padding: 30px;">No posts published yet.</p>';
                    return;
                }

                res.data.content.forEach(post => {
                    const postCard = document.createElement('div');
                    postCard.className = 'post-card';
                    postCard.innerHTML = `
                        <div style="font-size: 0.8rem; color: var(--text-muted); margin-bottom: 8px;">${post.timeAgo || 'Recently'}</div>
                        <div style="white-space: pre-wrap; margin-bottom: 10px;">${post.content}</div>
                        ${post.imageUrl ? `<img src="${post.imageUrl}" style="max-width: 100%; border-radius: 8px; margin-bottom: 8px;" alt="">` : ''}
                        <div style="color: var(--text-muted); font-size: 0.85rem;">
                            <i class="fa-solid fa-heart"></i> ${post.likesCount || 0} &nbsp; • &nbsp;
                            <i class="fa-solid fa-comment"></i> ${post.commentsCount || 0}
                        </div>
                    `;
                    container.appendChild(postCard);
                });
            } catch (err) {}
        }

        async function sendRequest() {
            await API.sendCoworkerRequest(viewedUserId);
            showToast('Co-worker request sent!');
            loadProfile(viewedUserId);
        }

        async function acceptRequest() {
            await API.acceptCoworkerRequest(viewedUserId);
            showToast('Connected as co-workers!');
            loadProfile(viewedUserId);
        }

        async function cancelRequest() {
            await API.cancelCoworkerRequest(viewedUserId);
            showToast('Request cancelled.');
            loadProfile(viewedUserId);
        }

        async function disconnectCoworker() {
            if (!confirm('Disconnect from this co-worker?')) return;
            await API.disconnectCoworker(viewedUserId);
            showToast('Disconnected.');
            loadProfile(viewedUserId);
        }

        async function follow() {
            await API.follow(viewedUserId);
            showToast('Now following!');
            loadProfile(viewedUserId);
        }

        async function unfollow() {
            await API.unfollow(viewedUserId);
            showToast('Unfollowed.');
            loadProfile(viewedUserId);
        }
    </script>
</body>
</html>
