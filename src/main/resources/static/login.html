<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" href="/icon/favicon.ico" type="image/x-icon">
    <title>Sign In - P&amp;C</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/modern-ui.css">
</head>
<body class="li-auth-page">

    <!-- Top Logo Only for Title / Branding -->
    <div style="margin-bottom: 24px; text-align: center;">
        <a href="/index.html" class="li-logo-link" title="Home">
            <img src="/icon/p&c.png" alt="Logo" style="width: 48px; height: 48px; border-radius: 8px;">
        </a>
    </div>

    <div class="li-auth-card">
        <h1 class="li-auth-title">Sign in</h1>
        <p class="li-auth-subtitle">Stay updated on your professional world</p>

        <div id="alertBox" style="display: none; padding: 10px 14px; background: rgba(224, 36, 94, 0.18); border: 1px solid var(--li-danger); color: #ff85a1; border-radius: var(--li-radius-sm); font-size: 13px; margin-bottom: 16px; text-align: left;"></div>

        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="li-form-group">
                <label class="li-label" for="email">Work Email</label>
                <input type="email" id="email" class="li-input" required autocomplete="email" placeholder="name@company.com">
            </div>

            <div class="li-form-group">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
                    <label class="li-label" for="password" style="margin-bottom: 0;">Password</label>
                    <a href="/forgot-password.html" style="font-size: 12px; color: var(--li-primary); text-decoration: none; font-weight: 600;">Forgot password?</a>
                </div>
                <input type="password" id="password" class="li-input" required autocomplete="current-password" placeholder="••••••••">
            </div>

            <button type="submit" id="submitBtn" class="li-btn-primary" style="width: 100%; padding: 12px; font-size: 15px; margin-top: 6px;">
                Sign In
            </button>
        </form>

        <div class="li-footer" style="margin-top: 24px; padding-top: 16px;">
            New to P&amp;C? <a href="/signup.html" style="color: var(--li-primary); font-weight: 600; text-decoration: none;">Join now</a>
        </div>
    </div>

    <!-- Mini Footer -->
    <div style="margin-top: 28px; text-align: center; font-size: 11px; color: var(--li-text-muted);">
        <div class="li-footer-links" style="margin-bottom: 6px;">
            <a href="/about-us.html">About</a>
            <a href="/support.html">Help Center</a>
            <a href="/terms-and-conditions.html">Privacy &amp; Terms</a>
        </div>
        <span>People &amp; Culture &copy; 2026</span>
    </div>

    <script src="/js/api.js"></script>
    <script>
        async function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const submitBtn = document.getElementById('submitBtn');
            const alertBox = document.getElementById('alertBox');

            alertBox.style.display = 'none';
            submitBtn.disabled = true;
            submitBtn.innerText = 'Signing in...';

            try {
                const res = await API.login(email, password);
                if (res.success) {
                    showToast('Welcome back!');
                    if (res.data && res.data.profileComplete === false) {
                        window.location.href = '/add-information.html';
                    } else {
                        window.location.href = '/index.html';
                    }
                }
            } catch (err) {
                alertBox.innerText = err.message || 'Invalid email or password.';
                alertBox.style.display = 'block';
                submitBtn.disabled = false;
                submitBtn.innerText = 'Sign In';
            }
        }
    </script>
</body>
</html>
