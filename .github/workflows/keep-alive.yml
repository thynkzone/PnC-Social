name: Keep Render Awake

on:
  schedule:
    # Run every 10 minutes to stay ahead of Render's 15-minute inactivity sleep timer
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  keep-alive:
    name: Ping Render Health Check
    runs-on: ubuntu-latest
    steps:
      - name: Ping Service
        env:
          RENDER_APP_URL: ${{ secrets.RENDER_APP_URL || vars.RENDER_APP_URL || 'https://pnc-social.onrender.com' }}
        run: |
          TARGET_URL="${RENDER_APP_URL%/}/actuator/health"
          echo "Pinging target: $TARGET_URL"
          
          # Send HTTP request with 60s timeout to allow waking up if asleep
          HTTP_STATUS=$(curl -s -o response.txt -w "%{http_code}" --max-time 60 "$TARGET_URL" || echo "000")
          
          echo "HTTP Status Code: $HTTP_STATUS"
          if [ -f response.txt ]; then
            echo "Response payload:"
            cat response.txt
            echo ""
          fi

          if [ "$HTTP_STATUS" -eq 200 ]; then
            echo "✅ Render backend is active and healthy!"
          elif [ "$HTTP_STATUS" -ge 500 ] && [ "$HTTP_STATUS" -le 504 ]; then
            echo "⏳ Render container was sleeping and is now spinning up."
          else
            echo "ℹ️ Ping executed with status $HTTP_STATUS"
          fi
